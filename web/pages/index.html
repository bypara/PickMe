<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Животные — PickMe</title>
    <link rel="stylesheet" href="/static/pickme.css">
    <link rel="stylesheet" href="/static/animals.css">
    <link rel="stylesheet" href="/static/add-animal.css">
    <script type="module" src="/static/navigation.js"></script>
    <script type="module" src="/static/catalog.js"></script>
    <script type="module" src="/static/add-animal.js"></script>
  </head>
  <body>
    <div class="site-frame">
      <header class="site-header">
        <div class="viewer" data-user-profile hidden>
          <span class="viewer-avatar" data-user-initials aria-hidden="true"></span>
          <div class="viewer-details">
            <strong data-user-name></strong>
            <span>Волонтёр</span>
          </div>
        </div>
        <a class="brand site-brand" href="/" aria-label="PickMe — каталог животных">
          <span class="brand-mark" aria-hidden="true"></span>PickMe
        </a>
        <nav class="site-actions" aria-label="Аккаунт">
          <a class="button button-primary" href="/login" data-login-link>Войти</a>
          <a class="button button-primary add-animal-button" href="/animals/new" aria-label="Добавить животное" data-add-animal hidden>
            <span class="add-icon" aria-hidden="true">+</span><span class="add-button-label">Добавить животное</span>
          </a>
          <button class="button button-outline signout-button" type="button" aria-label="Выйти" data-logout hidden>
            <span class="signout-icon" aria-hidden="true">→</span>
          </button>
        </nav>
      </header>
      <main class="catalog-shell">
        <p class="catalog-eyebrow">С заботой о каждом</p>
        <h1>Животные</h1>
        <p class="catalog-lead">Подопечные приюта, которым мы помогаем найти дом.</p>
        <p class="form-error" data-navigation-error role="alert" hidden></p>
        <div class="catalog-count-line" data-catalog-summary hidden>
          <p class="catalog-count" data-catalog-count></p>
        </div>
        <p class="catalog-status" data-catalog-status role="status">Загружаем животных…</p>
        <ul class="animal-grid" aria-label="Животные приюта" data-animal-grid></ul>
      </main>
    </div>
    <template id="animal-card-template">
      <li>
        <a class="animal-card">
          <div class="animal-media">
            <img class="animal-photo" data-animal-photo alt="" loading="lazy" decoding="async" hidden>
            <span class="animal-placeholder" data-photo-placeholder>
              <span class="brand-mark" aria-hidden="true"></span>Фото пока нет
            </span>
            <dl class="animal-preview">
              <div><dt>Порода</dt><dd data-animal-breed></dd></div>
              <div><dt>Где нашли</dt><dd data-animal-location></dd></div>
            </dl>
          </div>
          <div class="animal-caption">
            <h2 data-animal-name></h2>
            <span class="animal-arrow" aria-hidden="true">↗</span>
          </div>
        </a>
      </li>
    </template>
    <dialog class="animal-drawer" aria-labelledby="add-title" data-add-dialog>
      <header class="drawer-header">
        <h2 id="add-title">Добавить животное</h2>
        <a class="button button-outline drawer-close" href="/" aria-label="Закрыть форму">×</a>
      </header>
      <form class="drawer-form" method="post" enctype="multipart/form-data" data-animal-form>
        <div class="drawer-fields">
          <p class="drawer-intro">Расскажите о новом подопечном приюта.</p>
          <div class="drawer-field">
            <label for="animal-name">Кличка</label>
            <input id="animal-name" name="name" type="text" required aria-describedby="animal-name-error">
            <p id="animal-name-error" class="drawer-field-error" data-error-for="name" hidden></p>
          </div>
          <div class="drawer-field">
            <label for="animal-location">Где нашли</label>
            <input id="animal-location" name="found_location" type="text" placeholder="Улица, адрес или ориентир"
              required aria-describedby="animal-location-error">
            <p id="animal-location-error" class="drawer-field-error" data-error-for="found_location" hidden></p>
          </div>
          <div class="drawer-field">
            <label for="animal-breed">Порода</label>
            <input id="animal-breed" name="breed" type="text" placeholder="Например, метис или «неизвестно»"
              required aria-describedby="animal-breed-error">
            <p id="animal-breed-error" class="drawer-field-error" data-error-for="breed" hidden></p>
          </div>
          <div class="drawer-field">
            <p class="photo-label">Фото <span>необязательно</span></p>
            <label class="photo-picker" for="animal-photo">
              <input id="animal-photo" name="photo" type="file" accept="image/jpeg,image/png"
                aria-label="Выбрать фото" aria-describedby="animal-photo-hint animal-photo-error">
              <span class="picture-icon" aria-hidden="true"></span>
              <strong data-photo-name>Выбрать файл</strong>
              <span id="animal-photo-hint">JPEG или PNG до 5 МиБ</span>
            </label>
            <p id="animal-photo-error" class="drawer-field-error" data-error-for="photo" hidden></p>
          </div>
          <p class="form-error" data-animal-form-error role="alert" hidden></p>
        </div>
        <footer class="drawer-actions">
          <a class="button button-outline" href="/">Отмена</a>
          <button class="button button-primary" type="submit">Сохранить</button>
        </footer>
      </form>
    </dialog>
  </body>
</html>
