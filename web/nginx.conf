upstream pickme_api {
    zone pickme_api 64k;
    # Docker DNS обновляет адрес API после пересоздания контейнера.
    resolver 127.0.0.11 valid=5s ipv6=off;
    server app:8080 resolve;
}

server {
    listen 80;
    root /srv/pickme;
    index index.html;

    location /api/ {
        client_max_body_size 6m;
        # Исходный Host нужен Go, когда проверка источника опирается на заголовок Origin.
        proxy_set_header Host $http_host;
        proxy_pass http://pickme_api;
        error_page 413 = @payload_too_large;
    }

    location @payload_too_large {
        default_type application/json;
        return 413 '{"error":{"code":"payload_too_large","message":"Request body is too large"}}';
    }

    location = /login {
        try_files /login.html =404;
    }

    location = /register {
        try_files /register.html =404;
    }

    location ~ ^/animals/[1-9][0-9]*$ {
        try_files /animal.html =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
