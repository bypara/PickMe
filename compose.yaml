name: pickme

# API и Goose получают одинаковые учётные данные отдельно от URL подключения.
x-postgres-client-env: &postgres-client-env
  PGDATABASE: "${POSTGRES_DB:-pickme}"
  PGUSER: "${POSTGRES_USER:-pickme}"
  PGPASSWORD: "${POSTGRES_PASSWORD:-pickme}"

x-database-url: &database-url "${DATABASE_URL:-postgres://db:5432?sslmode=disable}"

services:
  db:
    image: postgres:17.12-alpine
    environment:
      POSTGRES_DB: "${POSTGRES_DB:-pickme}"
      POSTGRES_USER: "${POSTGRES_USER:-pickme}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-pickme}"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      # TCP-проверка ждёт основной сервер после инициализации тома. $$ оставляет подстановку оболочке контейнера.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 2s
      timeout: 3s
      retries: 15
      start_period: 5s

  migrate:
    build:
      context: .
      target: migrate
    environment:
      <<: *postgres-client-env
      GOOSE_DRIVER: postgres
      GOOSE_DBSTRING: *database-url
    depends_on:
      db:
        condition: service_healthy

  app:
    build:
      context: .
      target: app
    environment:
      <<: *postgres-client-env
      DATABASE_URL: *database-url
      HTTP_ADDR: ":8080"
      COOKIE_SECURE: "${COOKIE_SECURE:-false}"
    depends_on:
      # Успешное завершение migrate означает, что схема готова к работе API.
      migrate:
        condition: service_completed_successfully

  web:
    build:
      context: ./web
    ports:
      - "127.0.0.1:${WEB_PORT:-8080}:80"
    depends_on:
      app:
        condition: service_started
    healthcheck:
      # Запрос через Nginx проверяет всю цепочку до PostgreSQL.
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/api/health"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

volumes:
  postgres_data:
